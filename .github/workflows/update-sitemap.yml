name: Update Sitemap

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '*.md'
      - '*.html'
      - 'android-beta/**'
      - 'privacy-policy/**'
      - '_config.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          # bundler-cache is left off deliberately: this repo has an
          # Appraisals file (theme-gem test infra), and setup-ruby's
          # auto-caching tries to `bundle exec appraisal install` every
          # appraisal gemfile, one of which conflicts with our own Gemfile.
          # Plain `bundle install` below avoids that entirely.

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Sync generated sitemap.xml
        run: |
          if [ ! -f _site/sitemap.xml ]; then
            echo "jekyll-sitemap did not produce _site/sitemap.xml — aborting."
            exit 1
          fi
          cp _site/sitemap.xml sitemap.xml
          rm -rf _site

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Update sitemap.xml"
          git push
